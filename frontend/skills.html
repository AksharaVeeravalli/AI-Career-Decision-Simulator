<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skills Assessment | AI Career Decision Simulator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="logo">
            AI Career Decision Simulator
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="profile.html">Profile</a>
            <a href="skills.html" class="active">Skills</a>
        </div>
    </nav>


    <!-- Main Content -->
    <main class="container">

        <section class="page-header">

            <h1>Skills Assessment</h1>

            <p>
                Rate your current skill level from 1 to 5.
                This information will be used to identify your
                career skill gaps.
            </p>

        </section>


        <!-- Skills Form -->
        <section class="form-section">

            <form id="skillsForm">

                <!-- Python -->
                <div class="form-group">

                    <label for="python">
                        Python
                    </label>

                    <select id="python" name="python" required>

                        <option value="">
                            Select your level
                        </option>

                        <option value="1">
                            1 - Beginner
                        </option>

                        <option value="2">
                            2 - Basic
                        </option>

                        <option value="3">
                            3 - Intermediate
                        </option>

                        <option value="4">
                            4 - Advanced
                        </option>

                        <option value="5">
                            5 - Expert
                        </option>

                    </select>

                </div>


                <!-- Java -->
                <div class="form-group">

                    <label for="java">
                        Java
                    </label>

                    <select id="java" name="java" required>

                        <option value="">
                            Select your level
                        </option>

                        <option value="1">
                            1 - Beginner
                        </option>

                        <option value="2">
                            2 - Basic
                        </option>

                        <option value="3">
                            3 - Intermediate
                        </option>

                        <option value="4">
                            4 - Advanced
                        </option>

                        <option value="5">
                            5 - Expert
                        </option>

                    </select>

                </div>


                <!-- SQL -->
                <div class="form-group">

                    <label for="sql">
                        SQL
                    </label>

                    <select id="sql" name="sql" required>

                        <option value="">
                            Select your level
                        </option>

                        <option value="1">
                            1 - Beginner
                        </option>

                        <option value="2">
                            2 - Basic
                        </option>

                        <option value="3">
                            3 - Intermediate
                        </option>

                        <option value="4">
                            4 - Advanced
                        </option>

                        <option value="5">
                            5 - Expert
                        </option>

                    </select>

                </div>


                <!-- Statistics -->
                <div class="form-group">

                    <label for="statistics">
                        Statistics
                    </label>

                    <select id="statistics" name="statistics" required>

                        <option value="">
                            Select your level
                        </option>

                        <option value="1">
                            1 - Beginner
                        </option>

                        <option value="2">
                            2 - Basic
                        </option>

                        <option value="3">
                            3 - Intermediate
                        </option>

                        <option value="4">
                            4 - Advanced
                        </option>

                        <option value="5">
                            5 - Expert
                        </option>

                    </select>

                </div>


                <!-- Data Analysis -->
                <div class="form-group">

                    <label for="data_analysis">
                        Data Analysis
                    </label>

                    <select id="data_analysis" name="data_analysis" required>

                        <option value="">
                            Select your level
                        </option>

                        <option value="1">
                            1 - Beginner
                        </option>

                        <option value="2">
                            2 - Basic
                        </option>

                        <option value="3">
                            3 - Intermediate
                        </option>

                        <option value="4">
                            4 - Advanced
                        </option>

                        <option value="5">
                            5 - Expert
                        </option>

                    </select>

                </div>


                <!-- Web Development -->
                <div class="form-group">

                    <label for="web_development">
                        Web Development
                    </label>

                    <select
                        id="web_development"
                        name="web_development"
                        required
                    >

                        <option value="">
                            Select your level
                        </option>

                        <option value="1">
                            1 - Beginner
                        </option>

                        <option value="2">
                            2 - Basic
                        </option>

                        <option value="3">
                            3 - Intermediate
                        </option>

                        <option value="4">
                            4 - Advanced
                        </option>

                        <option value="5">
                            5 - Expert
                        </option>

                    </select>

                </div>


                <!-- Communication -->
                <div class="form-group">

                    <label for="communication">
                        Communication
                    </label>

                    <select
                        id="communication"
                        name="communication"
                        required
                    >

                        <option value="">
                            Select your level
                        </option>

                        <option value="1">
                            1 - Beginner
                        </option>

                        <option value="2">
                            2 - Basic
                        </option>

                        <option value="3">
                            3 - Intermediate
                        </option>

                        <option value="4">
                            4 - Advanced
                        </option>

                        <option value="5">
                            5 - Expert
                        </option>

                    </select>

                </div>


                <!-- Submit -->
                <div class="form-actions">

                    <button type="submit" class="primary-btn">
                        Continue to Career Selection →
                    </button>

                </div>

            </form>

        </section>

    </main>


    <!-- IMPORTANT:
         Only script.js handles the Skills API.
         There is NO old onclick/fetch code here.
    -->
    <script src="script.js"></script>

</body>
</html>
