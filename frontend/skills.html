            <label>Web Development</label>
            <select id="web_development">
                <option value="">Select your level</option>
                <option value="1">1 - Beginner</option>
                <option value="2">2 - Basic</option>

            <select id="communication">

                <option value="4">4 - Advanced</option>
                <option value="5">5 - Expert</option>
            </select>
        </div>


        <button type="button" id="continueButton">
            Continue to Career Selection →
        </button>

        <p id="message"></p>

    </div>


    <script>

        const API_BASE_URL = "http://127.0.0.1:8000";

        document.getElementById("continueButton").onclick = async function () {

            const profileId = localStorage.getItem("profileId");

            const message = document.getElementById("message");

            if (!profileId) {
                message.textContent =
                    "Profile not found. Please complete your profile first.";
                return;
            }


            const python = document.getElementById("python").value;
            const java = document.getElementById("java").value;
            const sql = document.getElementById("sql").value;
            const statistics = document.getElementById("statistics").value;
            const data_analysis = document.getElementById("data_analysis").value;
            const web_development = document.getElementById("web_development").value;
            const communication = document.getElementById("communication").value;


            if (
                !python ||
                !java ||
                !sql ||
                !statistics ||
                !data_analysis ||
                !web_development ||
                !communication
            ) {
                message.textContent =
                    "Please select a level for every skill.";
                return;
            }


            const button = document.getElementById("continueButton");

            button.disabled = true;
            button.textContent = "Saving Skills...";


            try {

                const response = await fetch(
                    API_BASE_URL + "/api/skills",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            profile_id: Number(profileId),

                            python: Number(python),

                            java: Number(java),

                            sql: Number(sql),

                            statistics: Number(statistics),

                            data_analysis: Number(data_analysis),

                            web_development: Number(web_development),

                            communication: Number(communication)

                        })
                    }
                );


                if (!response.ok) {
                    throw new Error(
                        "Backend error: " + response.status
                    );
                }


                const data = await response.json();


                localStorage.setItem(
                    "careerSkills",
                    JSON.stringify(data)
                );


                window.location.href = "career.html";


            } catch (error) {

                console.error(error);

                message.textContent =
                    "Unable to save skills. Make sure FastAPI is running.";

                button.disabled = false;

                button.textContent =
                    "Continue to Career Selection →";
            }

        };

    </script>

</body>
