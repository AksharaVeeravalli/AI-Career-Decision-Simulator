<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choose Your Career | AI Career Decision Simulator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVIGATION -->
    <nav class="navbar">

        <div class="logo">
            AI Career Decision Simulator
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="profile.html">Profile</a>
            <a href="skills.html">Skills</a>
            <a href="career.html" class="active">Career</a>
        </div>

    </nav>


    <!-- MAIN CONTENT -->
    <main class="container">

        <section class="page-header">

            <p>STEP 3 OF 3</p>

            <h1>Choose Your Career Path</h1>

            <p>
                Select a career you want to explore.
                Our AI will simulate what your journey could look like.
            </p>

        </section>


        <!-- CAREER FORM -->
        <section class="form-section">

            <form id="careerForm">

                <!-- CAREER -->
                <div class="form-group">

                    <label for="career">
                        Select Your Target Career
                    </label>

                    <select id="career" name="career" required>

                        <option value="">
                            Choose a career
                        </option>

                        <option value="software-developer">
                            Software Developer
                        </option>

                        <option value="data-analyst">
                            Data Analyst
                        </option>

                        <option value="data-scientist">
                            Data Scientist
                        </option>

                        <option value="ai-ml-engineer">
                            AI / ML Engineer
                        </option>

                        <option value="web-developer">
                            Web Developer
                        </option>

                        <option value="cloud-engineer">
                            Cloud Engineer
                        </option>

                    </select>

                </div>


                <!-- EXPERIENCE -->
                <div class="form-group">

                    <label for="experience">
                        Current Experience Level
                    </label>

                    <select id="experience" name="experience" required>

                        <option value="">
                            Select experience
                        </option>

                        <option value="beginner">
                            Beginner
                        </option>

                        <option value="student-with-projects">
                            Student with Projects
                        </option>

                        <option value="internship-experience">
                            Internship Experience
                        </option>

                        <option value="working-professional">
                            Working Professional
                        </option>

                    </select>

                </div>


                <!-- ERROR / STATUS MESSAGE -->
                <div id="careerMessage"
                     style="margin: 15px 0; font-weight: 500;">
                </div>


                <!-- SUBMIT -->
                <div class="form-actions">

                    <button
                        type="submit"
                        id="careerSubmit"
                        class="primary-btn"
                    >
                        Start Career Simulation →
                    </button>

                </div>

            </form>

        </section>

    </main>


    <!-- ==================================================
         CAREER PAGE JAVASCRIPT
         RENDER BACKEND
    ================================================== -->

    <script>

        const API_BASE_URL =
            "https://ai-career-decision-simulator.onrender.com";


        const careerForm =
            document.getElementById("careerForm");

        const careerSelect =
            document.getElementById("career");

        const experienceSelect =
            document.getElementById("experience");

        const careerMessage =
            document.getElementById("careerMessage");

        const careerSubmit =
            document.getElementById("careerSubmit");


        careerForm.addEventListener("submit", async function(event) {

            event.preventDefault();


            /* -----------------------------------------
               GET PROFILE ID
            ----------------------------------------- */

            const profileId =
                localStorage.getItem("profileId");


            if (!profileId) {

                careerMessage.textContent =
                    "Profile information not found. Please complete your profile first.";

                careerMessage.style.color = "red";

                return;
            }


            /* -----------------------------------------
               GET FORM VALUES
            ----------------------------------------- */

            const targetCareer =
                careerSelect.value;

            const experience =
                experienceSelect.value;


            if (!targetCareer) {

                careerMessage.textContent =
                    "Please select a career.";

                careerMessage.style.color = "red";

                return;
            }


            if (!experience) {

                careerMessage.textContent =
                    "Please select your experience level.";

                careerMessage.style.color = "red";

                return;
            }


            /* -----------------------------------------
               REQUEST DATA
            ----------------------------------------- */

            const careerData = {

                profile_id: parseInt(profileId, 10),

                target_career: targetCareer,

                experience: experience

            };


            console.log(
                "Sending career data:",
                careerData
            );


            /* -----------------------------------------
               SHOW LOADING
            ----------------------------------------- */

            careerSubmit.disabled = true;

            careerSubmit.textContent =
                "Saving Career Choice...";

            careerMessage.textContent =
                "Connecting to the AI Career Simulator...";

            careerMessage.style.color = "";


            try {

                /* -------------------------------------
                   SEND TO DEPLOYED FASTAPI
                ------------------------------------- */

                const response = await fetch(
                    `${API_BASE_URL}/api/career`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"
                        },

                        body:
                            JSON.stringify(careerData)
                    }
                );


                /* -------------------------------------
                   READ RESPONSE
                ------------------------------------- */

                const responseText =
                    await response.text();


                let data;

                try {

                    data =
                        responseText
                            ? JSON.parse(responseText)
                            : {};

                } catch {

                    data =
                        responseText;
                }


                console.log(
                    "Career API response:",
                    data
                );


                /* -------------------------------------
                   CHECK ERROR
                ------------------------------------- */

                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}: ${
                            typeof data === "string"
                                ? data
                                : JSON.stringify(data)
                        }`
                    );
                }


                /* -------------------------------------
                   SAVE CAREER LOCALLY
                ------------------------------------- */

                localStorage.setItem(
                    "careerChoice",
                    JSON.stringify(careerData)
                );


                if (data.career_id) {

                    localStorage.setItem(
                        "careerId",
                        String(data.career_id)
                    );
                }


                /* -------------------------------------
                   SUCCESS
                ------------------------------------- */

                careerMessage.textContent =
                    "Career saved successfully! Starting simulation...";

                careerMessage.style.color = "green";


                setTimeout(function() {

                    window.location.href =
                        "simulation.html";

                }, 500);


            } catch (error) {

                console.error(
                    "Career submission error:",
                    error
                );


                careerMessage.textContent =
                    "Unable to save career: " +
                    error.message;

                careerMessage.style.color = "red";


                careerSubmit.disabled = false;

                careerSubmit.textContent =
                    "Start Career Simulation →";
            }

        });

    </script>

</body>

</html>
