<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Choose Your Career | AI Career Decision Simulator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav class="navbar">

        <div class="logo">
            AI Career Decision Simulator
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="profile.html">Profile</a>
            <a href="skills.html">Skills</a>
            <a href="career.html" class="active">Career</a>
        </div>

    </nav>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="container">

        <section class="page-header">

            <p>
                STEP 3 OF 3
            </p>

            <h1>
                Choose Your Career Path
            </h1>

            <p>
                Select a career you want to explore.
                Our AI will simulate what your journey could look like.
            </p>

        </section>


        <!-- =========================
             CAREER FORM
        ========================== -->

        <section class="form-section">

            <form id="careerForm">

                <!-- Target Career -->

                <div class="form-group">

                    <label for="career">
                        Select Your Target Career
                    </label>

                    <select
                        id="career"
                        name="career"
                        required
                    >

                        <option value="">
                            Choose a career
                        </option>

                        <option value="software-developer">
                            Software Developer
                        </option>

                        <option value="data-analyst">
                            Data Analyst
                        </option>

                        <option value="data-scientist">
                            Data Scientist
                        </option>

                        <option value="ai-ml-engineer">
                            AI / ML Engineer
                        </option>

                        <option value="web-developer">
                            Web Developer
                        </option>

                        <option value="cloud-engineer">
                            Cloud Engineer
                        </option>

                    </select>

                </div>


                <!-- Experience Level -->

                <div class="form-group">

                    <label for="experience">
                        Current Experience Level
                    </label>

                    <select
                        id="experience"
                        name="experience"
                        required
                    >

                        <option value="">
                            Select experience
                        </option>

                        <option value="beginner">
                            Beginner
                        </option>

                        <option value="student-with-projects">
                            Student with Projects
                        </option>

                        <option value="internship-experience">
                            Internship Experience
                        </option>

                        <option value="working-professional">
                            Working Professional
                        </option>

                    </select>

                </div>


                <!-- Submit Button -->

                <div class="form-actions">

                    <button
                        type="submit"
                        class="primary-btn"
                    >
                        Start Career Simulation →
                    </button>

                </div>

            </form>

        </section>

    </main>


    <!-- =========================
         JAVASCRIPT
         ONLY script.js
    ========================== -->

    <script src="script.js"></script>

</body>

</html>
