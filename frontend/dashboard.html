```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Dashboard - CareerSim AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>📊 Career Dashboard</h1>

    <p>
        Review your profile, skills, career choice and hindsight memory
        in one place.
    </p>

    <div id="dashboard">
        <p>Loading your career dashboard...</p>
    </div>

</div>

<script>

const API_BASE_URL =
    "https://ai-career-decision-simulator.onrender.com";

const profileId =
    localStorage.getItem("profileId");

const dashboard =
    document.getElementById("dashboard");


async function loadDashboard() {

    if (!profileId) {

        dashboard.innerHTML = `
            <p>
                No profile found. Please complete your profile first.
            </p>
        `;

        return;
    }

    try {

        const response = await fetch(
            `${API_BASE_URL}/api/dashboard/${profileId}`
        );

        if (!response.ok) {
            throw new Error(
                `Server returned ${response.status}`
            );
        }

        const data = await response.json();

        console.log("Dashboard data:", data);

        const profile =
            data.profile || {};

        const skills =
            data.skills || {};

        const career =
            data.career || {};

        const memory =
            data.memory || {};

        const simulation =
            data.simulation || {};


        dashboard.innerHTML = `

            <section>

                <h2>👤 Profile</h2>

                <p>
                    <strong>Name:</strong>
                    ${escapeHtml(profile.name || "Not available")}
                </p>

                <p>
                    <strong>Education:</strong>
                    ${escapeHtml(profile.education || "Not available")}
                </p>

                <p>
                    <strong>Branch:</strong>
                    ${escapeHtml(profile.branch || "Not available")}
                </p>

                <p>
                    <strong>Year:</strong>
                    ${escapeHtml(profile.year || "Not available")}
                </p>

                <p>
                    <strong>Career Goal:</strong>
                    ${escapeHtml(profile.goal || "Not available")}
                </p>

            </section>


            <section>

                <h2>💻 Skills</h2>

                ${skillRow("Python", skills.python)}
                ${skillRow("Java", skills.java)}
                ${skillRow("SQL", skills.sql)}
                ${skillRow("Statistics", skills.statistics)}
                ${skillRow("Data Analysis", skills.data_analysis)}
                ${skillRow("Web Development", skills.web_development)}
                ${skillRow("Communication", skills.communication)}

            </section>


            <section>

                <h2>🎯 Career Choice</h2>

                <p>
                    <strong>Target Career:</strong>
                    ${escapeHtml(
                        career.target_career ||
                        "Not selected"
                    )}
                </p>

                <p>
                    <strong>Experience:</strong>
                    ${escapeHtml(
                        career.experience ||
                        "Not selected"
                    )}
                </p>

            </section>


            <section>

                <h2>📊 Simulation</h2>

                <p>
                    <strong>Readiness Score:</strong>
                    ${
                        simulation.readiness_score !== undefined
                        ? simulation.readiness_score + "/100"
                        : "Not available"
                    }
                </p>

            </section>


            <section>

                <h2>🧠 Hindsight Memory</h2>

                ${
                    memory && memory.career
                    ? `
                        <p>
                            <strong>Career:</strong>
                            ${escapeHtml(memory.career)}
                        </p>

                        <p>
                            <strong>Decision:</strong><br>
                            ${escapeHtml(memory.decision || "")}
                        </p>

                        <p>
                            <strong>Outcome:</strong><br>
                            ${escapeHtml(memory.outcome || "")}
                        </p>

                        <p>
                            <strong>Lesson:</strong><br>
                            ${escapeHtml(memory.lesson || "")}
                        </p>
                    `
                    :
                    `<p>No hindsight memory recorded yet.</p>`
                }

            </section>

        `;

    } catch (error) {

        console.error(
            "Dashboard error:",
            error
        );

        dashboard.innerHTML = `
            <p>
                ❌ Unable to load dashboard.
                Please try again after the backend is available.
            </p>
        `;
    }
}


function skillRow(name, value) {

    const level =
        value !== undefined &&
        value !== null
        ? value
        : "Not available";

    return `
        <p>
            <strong>${name}:</strong>
            ${level}/5
        </p>
    `;
}


function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


loadDashboard();

</script>

</body>
</html>
```
